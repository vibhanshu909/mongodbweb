overwrite: true
schema: 'http://localhost:3000/api/graphql'
documents: 'src/graphql/**/*.{ts,tsx}'
watchPattern: 'src/graphql/**/*.{ts,tsx}'
generates:
  src/generated/:
    preset: 'client'
    config:
      useTypeImports: true
      enumsAsTypes: true
      scalars:
        DateTime: 'string'
        JSON: 'Record<string, any>'
  src/generated/schema.graphql:
    plugins:
      - 'schema-ast'
  src/generated/introspection.json:
    plugins:
      - 'introspection'
